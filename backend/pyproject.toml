[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haan"
version = "0.1.0"
description = "Haan.ai - AI-powered software engineering pipeline with CrewAI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",

    # AI / LLM
    "crewai>=0.108.0",
    "crewai-tools>=0.38.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.1.0",

    # Data validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # CLI
    "typer[all]>=0.15.0",
    "rich>=13.9.0",

    # Async / networking / database
    "aiosqlite>=0.21.0",
    "httpx>=0.28.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
haan = "haan.main:cli_app"

[tool.hatch.build.targets.wheel]
packages = ["src/haan"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
